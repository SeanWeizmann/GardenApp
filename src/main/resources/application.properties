spring.application.name=GardenersApp
spring.config.import=optional:file:./secrets.properties
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/gardenapp?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# OAuth credentials come from optional secrets.properties locally, or the
# GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET environment variables.
